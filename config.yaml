---
name: "JK-BMS wired management"
version: 4.1.4
slug: "smartphoton_jkbms"
description: JK-BMS Management via RS485 & CAN bus or TCP/IP Gateway
url: https://domosimple.eu/forum/thread-917.html
ingress: false
ingress_stream: false
panel_icon: mdi:sitemap
init: false
homeassistant: 2025.10.1
arch:
  - aarch64
  - amd64
privileged:
  - NET_ADMIN
  - SYS_RAWIO
  - SYS_ADMIN
  - DAC_READ_SEARCH
  - SYS_MODULE
ports:
  "1891/tcp": 1891
ports_description:
  "1891/tcp": Web interface
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: true
auth_api: true
uart: true
full_access: true
map:
  - config:rw
  - media:rw
  - share:rw

options:
  jkbms_path: "/dev/serial/by-id/usb-xxxx_USB_Serial-abcdefghij"
  jkbms_count: 1
  use_gateway: false
  gateway_ip_port: "192.168.1.100:5000"
  communication_debug: false
  bms_broadcasting: false
  non_broadcasting_data_interval_s: 3
  CAN_bus_usage: false

  bluetooth_usage: false
  bluetooth_scan: true
  bluetooth_mac_1: ""
  bluetooth_mac_2: ""
  bluetooth_mac_3: ""

  mqttadresse_port: "core-mosquitto.local.hass.io:1883"
  mqttuser: "username"
  mqttpass: "password"

  Send_bip: true

  premium_section: "────────── PREMIUM ──────────"
  premium_key: ""

  dashboard_section: "────────── DASHBOARD ──────────"
  dashboard_custom_cards_installed: false
  dashboard_language: "fr"
  dashboard_mode: "legacy"

schema:
  jkbms_path: str
  jkbms_count: int(1,15)?
  use_gateway: bool
  gateway_ip_port: str?
  communication_debug: bool
  bms_broadcasting: bool
  non_broadcasting_data_interval_s: float(1,30)
  CAN_bus_usage: bool

  bluetooth_usage: bool
  bluetooth_scan: bool
  bluetooth_mac_1: str?
  bluetooth_mac_2: str?
  bluetooth_mac_3: str?

  mqttadresse_port: str?
  mqttuser: str?
  mqttpass: password?

  premium_section: str?
  premium_key: str?

  dashboard_section: str?
  dashboard_custom_cards_installed: bool
  dashboard_language: list(fr|en)
  dashboard_mode: list(legacy|html|both)

  Send_bip: bool
